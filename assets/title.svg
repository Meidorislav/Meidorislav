<svg xmlns="http://www.w3.org/2000/svg" width="720" height="130" viewBox="0 0 720 130" role="img" aria-label="Meidorislav">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#22d3ee;#a78bfa;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#8b5cf6;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="130">
        <animate attributeName="width" values="0;720;720" keyTimes="0;0.35;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>

  <text x="360" y="30" text-anchor="middle" class="mono" font-size="15" fill="#6b7280">
    <tspan fill="#a78bfa">~/</tspan>whoami
  </text>

  <g clip-path="url(#reveal)">
    <text x="360" y="92" text-anchor="middle" class="mono" font-size="64" font-weight="700" fill="url(#g)" filter="url(#glow)">&lt;Meidorislav /&gt;</text>
  </g>

  <rect x="648" y="48" width="12" height="52" rx="2" fill="#22d3ee">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="x" values="60;650;650" keyTimes="0;0.35;1" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
